name: Build IPA

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Instalar dependencias
        run: npm install

      - name: Preparar web (www)
        run: npm run prepare-web

      - name: Crear proyecto iOS
        run: npx cap add ios

      - name: Icono y splash
        run: |
          if [ -f assets/icon.png ]; then
            npm install --no-save @capacitor/assets@3
            [ -f assets/splash.png ] || cp assets/icon.png assets/splash.png
            [ -f assets/splash-dark.png ] || cp assets/splash.png assets/splash-dark.png
            npx capacitor-assets generate --ios
          else
            echo "No hay assets/icon.png, se usa el icono por defecto"
          fi

      - name: Sincronizar
        run: npx cap sync ios

      - name: Compilar (sin firmar)
        run: |
          cd ios/App
          xcodebuild -workspace App.xcworkspace -scheme App -configuration Release \
            -sdk iphoneos -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            clean build

      - name: Empaquetar .ipa
        run: |
          mkdir -p Payload
          cp -R ios/App/build/Build/Products/Release-iphoneos/App.app Payload/
          zip -qr DarielModz.ipa Payload

      - uses: actions/upload-artifact@v4
        with:
          name: DarielModz-ipa
          path: DarielModz.ipa
